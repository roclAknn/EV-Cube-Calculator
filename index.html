<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>キューブの確率計算器 | めいぽ電卓</title>
  <meta name="description" content="メイプルストーリー計算ツール 潜在能力を重複させるのにキューブがいくつ必要か表示します" />
  <link rel="icon" href="./images/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="/header.css">
  <script src="/header.js"></script>

  <script async src="/lib/goatcounter.js" data-goatcounter="https://roclaknn.goatcounter.com/count"></script>
  <script src="/lib/decimal.min.js"></script>

  <link rel="stylesheet" href="cube-calc.css">
  <script src="regularKMS.js"></script>
  <script src="additionalKMS.js"></script>
  <script src="regularTMS.js"></script>
  <script src="common.js"></script>
  <script src="cube-calc.js"></script>
</head>

<body onload="initialize()">
  <main>
    <div id="maindiv-wrapper">
      <div class="calculator-main">
        <!-- ==================== 上部設定パネル（メイン設定 ＆ キューブ情報表） ==================== -->
        <div id="header-config-panel" class="config-panel">
          <!-- 左側：メイン設定フォーム -->
          <div class="settings-form">
            <!-- キューブ情報表ヘッダー -->
            <div class="setting-form-header  summary-wrap">
              <span class="setting-form-title">メイン設定</span>
            </div>
            <!-- キューブ選択（独自SELECT） -->
            <div class="form-row">
              <label class="form-label">キューブ:</label>
              <div class="form-input-wrap">
                <div class="custom-select-container" id="cube-custom-select">
                  <div class="custom-select-trigger" id="cube-select-trigger" tabindex="0">
                    <span class="cube-icon-wrapper"><span class="cube-icon-thumb cube-selected-icon"></span></span>
                    <span class="custom-selected-name cube-selected-name">未選択</span>
                    <span class="cs-arrow">▼</span>
                  </div>
                  <div class="custom-select-dropdown" id="cube-select-dropdown"></div>
                </div>
              </div>
            </div>

            <!-- 装備種別（独自SELECT: 画像＋テキスト） -->
            <div class="form-row">
              <label class="form-label">装備種別:</label>
              <div class="form-input-wrap">
                <div class="custom-select-container" id="eqp-custom-select">
                  <div class="custom-select-trigger" id="eqp-select-trigger" tabindex="0">
                    <span class="eqp-icon-wrapper"><span class="eqp-icon-thumb eqp-selected-icon"></span></span>
                    <span class="custom-selected-name eqp-selected-name">武器</span>
                    <span class="cs-arrow">▼</span>
                  </div>
                  <div class="custom-select-dropdown" id="eqp-select-dropdown"></div>
                </div>
              </div>
            </div>

            <!-- 装備レベル -->
            <div class="form-row">
              <label for="input-equipmentlevel" class="form-label">装備Lv:</label>
              <div class="form-input-wrap">
                <input id="input-equipmentlevel" class="std-input no-spin" oninput="onchangesetting();" value="200"
                  type="number">
              </div>
            </div>

            <!-- 潜在等級 -->
            <div class="form-row">
              <label for="input-potentialrank" class="form-label">潜在等級:</label>
              <div class="form-input-wrap">
                <select id="input-potentialrank" class="std-select" onchange="onchangesetting();" required>
                  <option value="" hidden>未選択</option>
                </select>
              </div>
            </div>

            <!-- ユニキューブ専用：変更候補行数 -->
            <div class="form-row" id="form-row-maxline" style="display: none;">
              <label for="input-maxline" class="form-label">変更候補:</label>
              <div class="form-input-wrap">
                <select id="input-maxline" class="std-select">
                  <option value="3" selected>1行狙い</option>
                  <option value="2">2行狙い</option>
                  <option value="1">3行狙い</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 右側：キューブ情報表（縦横入れ替え表 または ヘキサ専用表） -->
          <div id="cube-info-panel" class="cube-info-panel">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- ==================== コンディションバー（2行レイアウト） ==================== -->
        <div class="condition-bar">
          <!-- 上段：左端に開閉アイコンボタン、右に選択中アイテムアイコンのみ表示 -->
          <div class="condition-top-line">
            <button type="button" class="panel-toggle-btn" id="panel-toggle-btn" title="メイン設定パネルの開閉">
              <span class="arrow-icon">▲</span>
            </button>
            <div class="condition-summary-group">
              <div class="condition-item" title="選択中キューブ">
                <span class="cube-icon-wrapper"><span class="cube-icon-thumb" id="condition-cube-icon"></span></span>
              </div>
              <div class="condition-item" title="選択中装備">
                <span class="eqp-icon-wrapper"><span class="eqp-icon-thumb" id="condition-eqp-icon"></span></span>
              </div>
              <div class="condition-item">
                <span id="condition-level">Lv.200</span>
              </div>
              <div class="condition-item">
                <span id="condition-rank" class="rank-pill legendary">レジェンダリー</span>
              </div>
            </div>
          </div>

          <!-- 下段：出力切り替え ＆ 有効オプション絞り込み -->
          <div class="condition-bottom-line">
            <!-- 左：有効オプションスライダー（ドラッグ対応） -->
            <div class="condition-filters-left">
              <div class="filter-slider-wrap" title="有効オプションに絞って表示（ドラッグ可能）">
                <span>潜在絞り込み:</span>
                <div class="filter-slider" id="filter-slider">
                  <div class="filter-slider-fill" id="filter-slider-fill"></div>
                  <div class="filter-slider-knob" id="filter-slider-knob"></div>
                </div>
                <span id="filter-slider-label">有効のみ</span>
              </div>
            </div>

            <!-- 右：出力切り替え（#displayToggleBtn準拠）、条件切り替え、値段入力 -->
            <div class="condition-controls-right">
              <!-- 出力種別切り替えボタン ＆ パラメータ入力（個数 または n%ライン） -->
              <div class="toggle-wrap">
                <!-- probモード用の個数入力 -->
                <div class="param-input-wrap hidden" id="paramNWrap">
                  <input type="number" id="paramNInput" class="param-input no-spin" value="1" min="1" step="1">
                  <span class="param-unit">個</span>
                </div>
                <!-- numpモード用の確率%入力 -->
                <div class="param-input-wrap hidden" id="paramPWrap">
                  <input type="number" id="paramPInput" class="param-input no-spin" value="95" min="1" max="99"
                    step="1">
                  <span class="param-unit">%</span>
                </div>
                <button type="button" class="display-toggle-btn" id="displayToggleBtn" title="クリックで切り替え">
                  <span id="displayToggleLabel">平均消費数[個]</span>
                  <span class="toggle-arrow">⇄</span>
                </button>
              </div>

              <!-- 条件切り替え（>= または ==） -->
              <button type="button" class="condition-toggle-btn" id="conditionToggleBtn" title="スコア判定条件の切り替え">
                スコア以上 (&gt;=)
              </button>

              <!-- 値段入力 -->
              <div class="price-input-wrap" title="1個あたりの単価">
                <span class="price-prefix">×</span>
                <input type="text" inputmode="decimal" id="exportPriceInput" class="price-input no-spin"
                  placeholder="値段など">
              </div>
            </div>
          </div>
        </div>

        <!-- ==================== 下部：潜在能力テーブル ＆ 出力結果表（常に横並び） ==================== -->
        <div class="content-grid">
          <!-- 左ペイン：潜在能力一覧・スコア入力 -->
          <div class="potential-pane">
            <div class="pane-header-row">
              <div class="pane-th pane-th-reset-btn-col">
                <button class="pane-th-reset-btn" onclick="resetAllScore();" title="スコア初期化">x</button>
              </div>
              <div class="pane-th">潜在能力</div>
              <div class="pane-th">
                <button type="button" class="pane-th-score-btn" onclick="openScoreModal();" title="スコア自動入力設定を開く">
                  Score ⚙
                </button>
              </div>
              <div class="pane-th">確率</div>
            </div>
            <div class="potential-list-scroll" id="potential-list-body">
              <!-- JSで動的生成 -->
            </div>
          </div>

          <!-- 右ペイン：計算結果表 -->
          <div class="result-pane">
            <div class="calc-result-scroll" id="calc-result-panel">
              <!-- JSで動的生成 -->
            </div>
          </div>
        </div>

      </div><!-- /.calculator-main -->
    </div><!-- /#maindiv-wrapper -->
  </main>

  <!-- ==================== スコア自動入力モーダル ==================== -->
  <div class="modal-overlay" id="score-modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">スコア自動入力</h3>
        <button type="button" class="modal-close-btn" id="score-modal-close" title="閉じる">✕</button>
      </div>
      <div class="modal-body" id="score-modal-body">
        <!-- JSで動的生成 -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="score-modal-cancel">キャンセル</button>
        <button type="button" class="btn-primary" id="score-modal-apply">適用する</button>
      </div>
    </div>
  </div>

</body>

</html>
